[project]
name = "recontact-api"
version = "0.1.0"
description = "Recontact API: FalkorDB duty maps for ClinVar classification changes."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "httpx",
  "falkordb",
  "apscheduler",
  "slowapi",
  "mcp>=1.10,<2",
  "pytest",
  "pytest-asyncio",
]

[project.optional-dependencies]
dev = [
  "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
